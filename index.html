<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechStart | Login</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="./assets/piscando.png" type="image/png">
</head>
<body>
  <main class="auth-layout">

    <section class="auth-card">

      <div class="logomarca">
        <h1><span class="tech">Tech</span>Start</h1>
        <div class="brand-badges">
        <img src="./assets/piscando.png" alt="Logo TechStart">
      </div>
      
      </div>

      <form id="login-form" class="auth-form">
        <label for="usuario">Usuário</label>
        <input type="email" id="usuario" placeholder="Digite seu e-mail" required>

        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="Digite sua senha" required>

        <button type="submit" class="primary-button">Entrar</button>
      </form>

      <p id="login-feedback" class="feedback" aria-live="polite"></p>

      <div class="auth-links">
        
        <p>Esqueceu sua senha? <a href="./pages/recuperar/recuperar.html">Esqueci minha senha</a></p>
        <p>Novo por aqui? <a href="./pages/cadastro/cadastro.html">Faça seu cadastro</a></p>
        <p>Ou então: <a href="#" id="guest-login">Entrar como convidado</a></p>

      </div>
    </section>
  </main>

  <div id="success-popup" class="popup hidden" role="dialog" aria-modal="true" aria-labelledby="popup-title">
    <div class="popup-card">
      <p class="section-label">Sucesso</p>
      <h3 id="popup-title">Login efetuado com sucesso</h3>
      <p>Você será redirecionado para a tela inicial do usuário.</p>
      <button type="button" class="primary-button" id="popup-confirm">Continuar</button>
    </div>
  </div>

  <script src="./shared/firebase-config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.7.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore-compat.js"></script>
  <script src="./shared/firebase.js"></script>
  <script src="./shared/firebase-client.js"></script>
  <script src="./shared/challenges.js"></script>
  <script src="./shared/app.js"></script>
  <script src="script.js"></script>
</body>
</html>
