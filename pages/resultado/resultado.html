<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechStart | Resultado</title>
  <link rel="stylesheet" href="style.css">
  <link rel="shortcut icon" href="../../assets/piscando.png" type="image/x-icon">
</head>
<body>
  <main class="result-layout">
    <section class="result-hero" id="result-hero">
      <a class="back-link" href="../dashboard/dashboard.html">Voltar ao painel</a>
      <p class="section-label" id="room-chip">Sala</p>
      <h1 id="result-title">Resultado do duelo</h1>
      <p class="muted" id="result-summary"></p>
      <div class="score-board">
        <article class="player-score blue-side">
          <p class="section-label">Azul</p>
          <h2 id="player-one-name">Jogador 1</h2>
          <strong id="player-one-score">0</strong>
        </article>
        <span class="versus">vs</span>
        <article class="player-score red-side">
          <p class="section-label">Vermelho</p>
          <h2 id="player-two-name">Jogador 2</h2>
          <strong id="player-two-score">0</strong>
        </article>
      </div>
      <div class="result-actions">
        <button type="button" id="rematch-button" class="primary-button">Pedir/Aceitar revanche</button>
        <button type="button" id="new-opponent-button" class="secondary-button">Jogar com outro aleatorio</button>
      </div>
    </section>
  </main>

  <div id="popup" class="popup hidden" role="dialog" aria-modal="true">
    <div class="popup-card">
      <p class="section-label">TechStart</p>
      <h3 id="popup-title"></h3>
      <p id="popup-text"></p>
      <button type="button" class="primary-button" id="popup-button">Continuar</button>
    </div>
  </div>

  <script src="../../shared/firebase-config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.7.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore-compat.js"></script>
  <script src="../../shared/firebase.js"></script>
  <script src="../../shared/firebase-client.js"></script>
  <script src="../../shared/challenges.js"></script>
  <script src="../../shared/app.js"></script>
  <script src="script.js"></script>
</body>
</html>
