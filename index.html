<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechStart | Login</title>
  <link rel="stylesheet" href="style.css?v=20260820-2">
  <link rel="icon" href="./assets/pandarodando.gif" type="gif">
</head>

<body>

  <div class="estrelas" id="estrelas-container"></div>
  <div class="codigos" id="codigos-container"></div>

  <main class="auth-layout">

    <section class="autenticacao_card">

      <div class="div_logomarca">

        <h1><span class="tech">Tech</span>Start</h1>
        <div class="brand-badges">
        <img src="./assets/acenando.gif" alt="Panda Logo TechStart" id="panda_logo">

      </div>
      
      </div>

      <form id="login-form" class="auth-form">
        <label for="usuario">Email</label>
        <input type="email" id="usuario" placeholder="Digite seu e-mail" required>

        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="Digite sua senha" required>

        <div class="div_botao_entrar">

           <button type="submit" id="entrar" class="botao_primario">Entrar</button>

        </div>

       
      </form>

      <p id="login-feedback" class="feedback" aria-live="polite"></p>

      <div class="autenticacao_links">
        
        <p>Esqueceu sua senha? <a href="./pages/recuperar/recuperar.html">Recuperar</a></p>
        <p>Novo por aqui? <a href="./pages/cadastro/cadastro.html">Cadastre-se aqui</a></p>
        <p>Ou então <a href="#" id="guest-login">entrar como convidado</a></p>

      </div>
    </section>
  </main>

  <div id="success-popup" class="popup hidden" role="dialog" aria-modal="true" aria-labelledby="popup-title">
    <div class="popup-card">

      <h3 id="popup-title">Login efetuado com sucesso</h3>
      <p id="msg_bemvindo">Bem-vindo ao TechStart!</p>

      <div class="div_botao_continuar">

        <button type="button" class="botao_primario" id="popup-confirm">Continuar</button>

      </div>
      
    </div>
  </div>

  <script src="./shared/firebase-config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.7.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore-compat.js"></script>
  <script src="./shared/firebase.js"></script>
  <script src="./shared/firebase-client.js"></script>
  <script src="./shared/challenges.js"></script>
  <script src="./shared/app.js"></script>
  <script src="script.js"></script>
</body>
</html>
