<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechStart | Desafio</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="../../assets/piscando.png" type="image/png">
</head>
<body>
  <button id="offline-back-button" class="text-button hidden" type="button">Voltar</button>

  <main class="challenge-layout">
    <header class="match-topbar">
      <div>
        <p class="section-label" id="room-chip">Sala</p>
        <h1 id="round-indicator">Round</h1>
      </div>

      <div class="score-strip">
        <div class="player-side blue-side">
          <strong id="player-one-name">Jogador 1</strong>
          <span id="player-one-score">0 pts</span>
        </div>
        <div class="timer-box">
          <span id="timer-indicator">05:00</span>
        </div>
        <div class="player-side red-side">
          <strong id="player-two-name">Jogador 2</strong>
          <span id="player-two-score">0 pts</span>
        </div>
      </div>
    </header>

    <section class="panel challenge-panel">
      <div class="challenge-meta">
        <div>
          <p class="section-label">Desafio</p>
          <h2 id="challenge-name">Preparando round</h2>
          <p id="challenge-description" class="muted"></p>
        </div>
        <div class="language-chip" id="language-chip"></div>
      </div>

      <textarea id="solution-input" placeholder="Digite sua solucao aqui."></textarea>

      <div class="editor-actions">
        <button id="test-button" class="secondary-button">Testar</button>
        <button id="submit-button" class="primary-button">Enviar solucao</button>
        <button id="help-button" class="secondary-button">Solicitar ajuda externa</button>
      </div>

      <div class="feedback-grid">
        <article class="feedback-card">
          <h3>Resultado</h3>
          <p id="result-output" class="muted">Os testes e o feedback aparecerao aqui.</p>
        </article>
        <article class="feedback-card">
          <h3>Analise da IA</h3>
          <p id="ai-output" class="muted">A IA vai analisar sua resposta apos o inicio do exercicio.</p>
        </article>
      </div>
    </section>
  </main>

  <div id="popup" class="popup hidden" role="dialog" aria-modal="true">
    <div class="popup-card">
      <p class="section-label">TechStart</p>
      <h3 id="popup-title"></h3>
      <p id="popup-text"></p>
      <button type="button" class="primary-button" id="popup-button">Continuar</button>
    </div>
  </div>

  <script src="../../shared/firebase-config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.7.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore-compat.js"></script>
  <script src="../../shared/firebase.js"></script>
  <script src="../../shared/firebase-client.js"></script>
  <script src="../../shared/challenges.js"></script>
  <script src="../../shared/app.js"></script>
  <script src="script.js"></script>
</body>
</html>
